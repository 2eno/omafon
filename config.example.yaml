# Omafon – Beispielkonfiguration. Kopieren nach /etc/omafon/config.yaml
owner_name: Oma Erika          # erscheint in der Notruf-SMS

contacts:
  # name:       so wird angesagt ("Anruf von Peter")
  # spoken:     Wörter, auf die die Sprachwahl hört (klein, im Vosk-Wortschatz!)
  # speed_dial: Taste 1–9 lang drücken
  # emergency:  Reihenfolge der Notrufkette
  - name: Peter
    number: "+491711234567"
    spoken: [peter, sohn]
    speed_dial: 1
    emergency: 1
  - name: Maria
    number: "+491609876543"
    spoken: [maria, tochter]
    speed_dial: 2
    emergency: 2
  - name: der Enkel
    number: "+491525550000"
    spoken: [enkel]
    speed_dial: 3
    emergency: 3
    admin: true                # darf per SMS "STATUS" den Zustand abfragen
  - name: Doktor Weber
    number: "06990009123"         # fiktiv (BNetzA-Bereich für Medien)
    spoken: [doktor, arzt, weber]
    speed_dial: 9
  # Letzter Notfalleintrag: 112 oder Hausnotrufzentrale
  - name: den Notruf
    number: "112"
    spoken: [notruf]
    emergency: 9

emergency_ring_seconds: 30     # so lange klingelt es bei jedem Kontakt
emergency_rounds: 2            # Kette zweimal durchlaufen
emergency_callback_minutes: 30 # Rückrufe der Notfallkontakte automatisch annehmen
quiet_hours: [22, 7]           # nachts kein Gong, neue SMS nur per LED
news_signal_minutes: 10        # neue SMS: Gong, dann alle 10 min wieder, bis gelesen (0 = nur einmal)
news_led: true                 # LED blinkt, solange ungelesene SMS da sind
default_route: earpiece        # earpiece = am Ohr, speaker = immer Freisprechen
volume: 4                      # 1..5
entry_timeout_s: 20
long_press_s: 1.2
hangup_hold_s: 0.5            # im Gespräch Auflegetaste so lange halten (Wange am Ohr streift sie sonst); 0 = sofort
sos_hold_s: 3.0
sos_cancel_window_s: 5

audio_device: "plughw:CARD=Device,DEV=0"   # CM108-Soundkarte, siehe "aplay -L"
mic_device: "plughw:CARD=Device,DEV=0"
cache_dir: /var/cache/omafon
piper_bin: /opt/omafon/piper/piper
piper_model: /opt/omafon/voices/de_DE-thorsten-medium.onnx
speech_rate: 1.2               # 1.0 normal, 1.2 = 20 % langsamer

vosk_model: /opt/omafon/vosk-model-small-de-0.15
remote_stt_url: null           # z. B. "http://10.8.0.1:9000/stt" (eigener Whisper-Server)
dictation_silence_s: 2.5
dictation_max_s: 40

serial_port: /dev/ttyAMA0
serial_baud: 115200
data_dir: /data/omafon         # beschreibbare Partition (System ist schreibgeschützt)
