# Omafon: Soundkarte (CM108) für mehrere Programme gleichzeitig.
#
# Im Festnetz-Gespräch hält baresip die Soundkarte. Ohne diese Datei fielen
# dann alle Ansagen aus (Ziffern, "Lautsprecher an", Lautstärke), weil aplay
# das Gerät nicht öffnen kann. dmix mischt die Wiedergabe, dsnoop teilt das
# Mikrofon. In config.yaml: audio_device: omafon und mic_device: omafon.
#
#   sudo cp systemd/omafon-asound.conf /etc/asound.conf
#   aplay -L | grep omafon        # muss "omafon" zeigen
#
# Fehlt die Datei, weicht Omafon auf plughw:CARD=Device,DEV=0 aus (dann wie
# früher: Ansagen im Gespräch fallen aus) und schreibt das ins Log.

pcm.omafon_out {
    type dmix
    ipc_key 47110
    ipc_perm 0660
    slave {
        pcm "hw:CARD=Device,DEV=0"
        rate 48000
        channels 2
        period_size 1024
        buffer_size 4096
    }
}

pcm.omafon_in {
    type dsnoop
    ipc_key 47111
    ipc_perm 0660
    slave {
        pcm "hw:CARD=Device,DEV=0"
        rate 48000
        channels 1
    }
}

pcm.omafon {
    type asym
    playback.pcm "plug:omafon_out"
    capture.pcm "plug:omafon_in"
    hint {
        show on
        description "Omafon (geteilt: Ansagen + Gespräch)"
    }
}
