# Omafon – example configuration LANDLINE (Fritz!Box, Wi-Fi, SIP).
# Copy to /etc/omafon/config.yaml and replace the placeholders.
# NEVER put real passwords into the repository – config.yaml is in .gitignore.
backend: sip
owner_name: Oma Erika

sip:
  registrar: fritz.box
  # Fritz!Box: Telephony → Telephony Devices → New Device → Telephone → LAN/WLAN (IP phone).
  # Enter the user name and password from there here.
  user: "omafon-ip"
  password: "PLATZHALTER_SIP_KENNWORT"
  regint: 300
  link_grace_s: 10             # the connection may be gone this long before it is announced
  wifi_iface: wlan0

fritz:
  host: fritz.box
  # Dedicated Fritz!Box user (System → FRITZ!Box Users) with only the right
  # "voice messages, fax messages, FRITZ!App Fon and call list".
  user: "omafon"
  password: "PLATZHALTER_FRITZ_KENNWORT"
  tam: 0                       # first answering machine
  phonebook_id: 0              # first phone book
  tam_poll_s: 60
  tam_after_fetch: mark        # mark | delete | keep

notify:                        # replacement for emergency SMS – optional, off by default
  enabled: false
  telegram_token: null         # "123456:ABC…" from @BotFather
  smtp_host: null              # e.g. smtp.example.org
  smtp_port: 587
  smtp_user: null
  smtp_password: null
  smtp_from: null

home_position: null            # e.g. [50.1109, 8.6821] – then the emergency notice contains a map link

contacts:
  - name: Peter
    number: "+491711234567"
    spoken: [peter, sohn]
    speed_dial: 1
    emergency: 1
    telegram_chat_id: null     # chat ID, after Peter has written to the bot
    email: peter@example.org
  - name: Maria
    number: "+491609876543"
    spoken: [maria, tochter]
    speed_dial: 2
    emergency: 2
    telegram_chat_id: null
  - name: der Enkel
    number: "+491525550000"
    spoken: [enkel]
    speed_dial: 3
    emergency: 3
  - name: Doktor Weber
    number: "06990009123"      # fictitious (BNetzA range for media)
    spoken: [doktor, arzt, weber]
    speed_dial: 9
  - name: den Notruf           # always last in the chain
    number: "112"
    spoken: [notruf]
    emergency: 9

emergency_ring_seconds: 30
emergency_rounds: 2
emergency_callback_minutes: 30
quiet_hours: [22, 7]
news_signal_minutes: 10
news_led: true
link_reminder_minutes: 10      # connection lost: repeat the announcement every 10 min

# cradle with speaker
answer_on_lift: true           # lifting answers
dock_in_call: hangup           # putting down hangs up (like a classic handset); handsfree = hands-free
dock_speaker: true             # in the cradle, talk and ring through its speaker

default_route: earpiece
volume: 4
entry_timeout_s: 20
long_press_s: 1.2
hangup_hold_s: 0.5            # during a call, hold the hang-up key this long (the cheek brushes it otherwise); 0 = immediately
sos_hold_s: 3.0
sos_cancel_window_s: 5

audio_device: "plughw:CARD=Device,DEV=0"
mic_device: "plughw:CARD=Device,DEV=0"
cache_dir: /var/cache/omafon
piper_bin: /opt/omafon/piper/piper
piper_model: /opt/omafon/voices/de_DE-thorsten-medium.onnx
speech_rate: 1.2

vosk_model: /opt/omafon/vosk-model-small-de-0.15
remote_stt_url: null
dictation_silence_s: 2.5
dictation_max_s: 40

data_dir: /data/omafon
